name: Publish marketing site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout website package
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Extract static website
        run: python3 -m zipfile -e site.zip public
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
